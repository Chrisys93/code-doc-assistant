# Preset for the Windows + WSL2 + minikube (docker driver, --gpus=all) setup the chart was verified on.
#   helm upgrade --install cda ./helm/code-doc-assistant -n code-doc --create-namespace \
#     -f helm/code-doc-assistant/values-wsl2-minikube.yaml
inferenceBackend: llamacpp
modelTier: heavy
llamacpp:
  enabled: true
  gpuLayers: 27          # RTX 5070 Ti 12 GB under WSL2: ~11.8 GB used of 12.2 GB; chart default for the heavy tier is 24 (conservative)
  download:
    enabled: true          # ~10 GB, first start only
  gpu:
    enabled: true
    wsl2: true             # runtime GPU injection + libdxcore.so mount (device plugin does not work on WSL2)
  startupFailureThreshold: 180   # 30 min; first (cold) load took ~15 min
app:
  service:
    type: NodePort
    nodePort: 30501        # Streamlit UI
mlflow:
  service:
    type: NodePort
    nodePort: 30500        # MLflow UI
  workers: 1             # default (4 processes) held 2.3 GB of the 12 GB WSL VM; memory exhaustion broke heavy-009 after Q4
