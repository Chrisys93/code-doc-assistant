{{- /* gpu.wsl2 implies runtime mode: the NVIDIA device plugin cannot see a WSL2 GPU */ -}}
{{- $gpu := .Values.ollama.gpu -}}
{{- $runtime := or (eq ($gpu.mode | default "resource") "runtime") $gpu.wsl2 -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "code-doc-assistant.fullname" . }}-ollama
  labels:
    {{- include "code-doc-assistant.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
spec:
  serviceName: {{ include "code-doc-assistant.fullname" . }}-ollama
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "code-doc-assistant.name" . }}
      app.kubernetes.io/component: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "code-doc-assistant.name" . }}
        app.kubernetes.io/component: ollama
    spec:
      {{- if and $gpu.enabled $gpu.runtimeClassName }}
      runtimeClassName: {{ $gpu.runtimeClassName | quote }}
      {{- end }}
      containers:
        - name: ollama
          image: "{{ .Values.ollama.image.repository }}:{{ .Values.ollama.image.tag }}"
          imagePullPolicy: {{ .Values.ollama.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.ollama.service.port }}
              name: http
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0"
            - name: OLLAMA_MODEL
              value: {{ include "code-doc-assistant.ollamaModel" . }}
            {{- if and $gpu.enabled $runtime }}
            # gpu.mode=runtime (or wsl2): no nvidia.com/gpu request; the node's NVIDIA container
            # runtime injects the GPU because of these variables. Same mechanism as llamacpp.gpu.
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "compute,utility"
            {{- end }}
            {{- $inferenceConfig := include "code-doc-assistant.inferenceConfig" . | fromYaml }}
            {{- range $key, $value := $inferenceConfig }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          resources:
            {{- if and $gpu.enabled (not $runtime) (eq (.Values.deploymentTarget | default "local") "local") }}
            limits:
              nvidia.com/gpu: 1
            {{- else }}
            {{- include "code-doc-assistant.ollamaResources" . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
            {{- if and $gpu.enabled $gpu.wsl2 }}
            # WSL2: the NVIDIA runtime nested inside the node does not inject libdxcore.so, so NVML
            # fails with "Not Supported". Mount the node's copy in (same as llamacpp.gpu.wsl2).
            - name: wsl-libdxcore
              mountPath: {{ $gpu.libdxcorePath | default "/usr/lib/x86_64-linux-gnu/libdxcore.so" | quote }}
              readOnly: true
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/tags
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/tags
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
      # Init container: pull the LLM and embedding models before the main container starts
      initContainers:
        - name: model-pull
          image: "{{ .Values.ollama.image.repository }}:{{ .Values.ollama.image.tag }}"
          command:
            - bash
            - -c
            - |
              # Fail loudly: a pull that silently fails leaves an empty model store and every
              # embedding call later returns 404 (nothing is ever indexed).
              set -u
              echo "Starting Ollama for model pull..."
              ollama serve &
              # Wait for the server instead of a fixed sleep: startup time varies a lot.
              up=0
              for i in $(seq 1 90); do
                if ollama list >/dev/null 2>&1; then up=1; break; fi
                sleep 2
              done
              if [ "$up" != "1" ]; then echo "ERROR: Ollama did not become ready in 180s"; exit 1; fi
              pull_model() {
                m="$1"
                for attempt in 1 2 3 4 5; do
                  echo "Pulling $m (attempt $attempt)"
                  if ollama pull "$m"; then return 0; fi
                  sleep 10
                done
                echo "ERROR: could not pull $m"
                return 1
              }
              {{- if include "code-doc-assistant.ollamaPullLlm" . }}
              pull_model "{{ include "code-doc-assistant.ollamaModel" . }}" || exit 1
              {{- else }}
              echo "Skipping LLM pull (inferenceBackend={{ .Values.inferenceBackend }}); embedding model only."
              {{- end }}
              pull_model "{{ include "code-doc-assistant.embeddingModel" . }}" || exit 1
              ollama list
              ollama list | grep -q "{{ include "code-doc-assistant.embeddingModel" . }}" || { echo "ERROR: embedding model missing after pull"; exit 1; }
              echo "Model pull complete."
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
          resources:
            {{- include "code-doc-assistant.ollamaResources" . | nindent 12 }}
      {{- if and $gpu.enabled $gpu.wsl2 }}
      volumes:
        - name: wsl-libdxcore
          hostPath:
            path: {{ $gpu.libdxcorePath | default "/usr/lib/x86_64-linux-gnu/libdxcore.so" | quote }}
            type: File
      {{- end }}
  {{- if .Values.ollama.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: ollama-data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.ollama.persistence.storageClass }}
        storageClassName: {{ .Values.ollama.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.ollama.persistence.size }}
  {{- end }}
