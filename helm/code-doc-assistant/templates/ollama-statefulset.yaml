apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "code-doc-assistant.fullname" . }}-ollama
  labels:
    {{- include "code-doc-assistant.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
spec:
  serviceName: {{ include "code-doc-assistant.fullname" . }}-ollama
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "code-doc-assistant.name" . }}
      app.kubernetes.io/component: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "code-doc-assistant.name" . }}
        app.kubernetes.io/component: ollama
    spec:
      containers:
        - name: ollama
          image: "{{ .Values.ollama.image.repository }}:{{ .Values.ollama.image.tag }}"
          imagePullPolicy: {{ .Values.ollama.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.ollama.service.port }}
              name: http
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0"
            - name: OLLAMA_MODEL
              value: {{ include "code-doc-assistant.ollamaModel" . }}
            {{- $inferenceConfig := include "code-doc-assistant.inferenceConfig" . | fromYaml }}
            {{- range $key, $value := $inferenceConfig }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          resources:
            {{- include "code-doc-assistant.ollamaResources" . | nindent 12 }}
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
          readinessProbe:
            httpGet:
              path: /api/tags
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/tags
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
      # Init container: pull the LLM and embedding models before the main container starts
      initContainers:
        - name: model-pull
          image: "{{ .Values.ollama.image.repository }}:{{ .Values.ollama.image.tag }}"
          command:
            - bash
            - -c
            - |
              # Fail loudly: a pull that silently fails leaves an empty model store and every
              # embedding call later returns 404 (nothing is ever indexed).
              set -u
              echo "Starting Ollama for model pull..."
              ollama serve &
              # Wait for the server instead of a fixed sleep: startup time varies a lot.
              up=0
              for i in $(seq 1 90); do
                if ollama list >/dev/null 2>&1; then up=1; break; fi
                sleep 2
              done
              if [ "$up" != "1" ]; then echo "ERROR: Ollama did not become ready in 180s"; exit 1; fi
              pull_model() {
                m="$1"
                for attempt in 1 2 3 4 5; do
                  echo "Pulling $m (attempt $attempt)"
                  if ollama pull "$m"; then return 0; fi
                  sleep 10
                done
                echo "ERROR: could not pull $m"
                return 1
              }
              {{- if include "code-doc-assistant.ollamaPullLlm" . }}
              pull_model "{{ include "code-doc-assistant.ollamaModel" . }}" || exit 1
              {{- else }}
              echo "Skipping LLM pull (inferenceBackend={{ .Values.inferenceBackend }}); embedding model only."
              {{- end }}
              pull_model "{{ include "code-doc-assistant.embeddingModel" . }}" || exit 1
              ollama list
              ollama list | grep -q "{{ include "code-doc-assistant.embeddingModel" . }}" || { echo "ERROR: embedding model missing after pull"; exit 1; }
              echo "Model pull complete."
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
          resources:
            {{- include "code-doc-assistant.ollamaResources" . | nindent 12 }}
  {{- if .Values.ollama.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: ollama-data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.ollama.persistence.storageClass }}
        storageClassName: {{ .Values.ollama.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.ollama.persistence.size }}
  {{- end }}
