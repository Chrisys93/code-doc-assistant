# ============================================================
# Docker Compose Override — Dev environment (MLflow + live-reload)
# ============================================================
# This is an OVERLAY, layered on top of the base file exactly like
# docker-compose.gpu.yml — it only contains the dev-specific deltas
# (MLflow tracking server, app wiring, src live-reload). It does NOT
# re-declare ollama / chromadb / app from scratch.
#
# Usage (mirrors the gpu overlay):
#   # GPU + dev:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml -f docker-compose.dev.yml up --build
#   # CPU + dev:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#   # or just: ./run-dev.sh
#
# NOTE: mlflow is defined behind the "observability" profile in the base
# docker-compose.yml; this overlay's own mlflow service inherits that
# restriction. app.depends_on: mlflow means the project won't validate
# unless the profile is active:
#   COMPOSE_PROFILES=observability ./run-dev.sh
# run-dev.sh should export this so it's not a flag you have to remember —
# see the top of that script.
#
# Access:
#   Streamlit UI:  http://localhost:8501
#   MLflow UI:     http://localhost:5000
# ============================================================

services:

  # --- MLflow tracking server (new service, added by this overlay) ---
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: code-doc-mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --default-artifact-root=/mlflow/artifacts
    healthcheck:
      # mlflow image is python-based, so python3 + urllib exist here (unlike the
      # ollama/chroma minimal images) — this probe actually works.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- App deltas (merged onto the base app service) ---
  app:
    environment:
      # Point the tracking client at the mlflow service by name, not localhost.
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      # Multi-repo fair-merge retrieval: total chunks returned across ALL active
      # collections combined, split fairly per repo (tools.py tool_vector_search
      # defaults to this when the planner doesn't specify top_k explicitly).
      # 5 was too tight for 2+ repo queries (~2-3 slots/repo); 10 gives each
      # repo more room to surface something genuinely relevant.
      - TOP_K=${TOP_K:-10}
    depends_on:
      # service_started, not service_healthy: observability must never gate the
      # app. mlflow calls in the agent are wrapped in try/except, so if the
      # tracking server is down the app still serves — it just won't log.
      mlflow:
        condition: service_started
    volumes:
      # Live-reload during development: edits under ./src are reflected without
      # rebuilding the image (Streamlit auto-reruns on change).
      - ./src:/app/src

volumes:
  mlflow_data:
    driver: local
