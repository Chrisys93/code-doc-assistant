# ============================================================
# Code Documentation Assistant — Docker Compose (dev branch)
# ============================================================
# Changes from main docker-compose.yml:
#   - MLflow tracking server (always-on, not behind profile)
#   - vLLM service (GPU required, behind 'vllm' profile)
#   - HITL_ENABLED, OUTPUT_REVIEW_MODE, QUALITY_GATE_THRESHOLD
#   - INFERENCE_BACKEND: "auto" (default: follows the running stack) | "ollama" | "vllm" | "llamacpp"
#   - CONFIDENCE_THRESHOLD, MAX_RETRIEVAL_ATTEMPTS configurable
#   - src/ bind-mount for live-reload during development
#
# Usage:
#   docker compose -f docker-compose.dev.yml up --build
#   HITL_ENABLED=false docker compose -f docker-compose.dev.yml up
#   OUTPUT_REVIEW_MODE=supervisor docker compose -f docker-compose.dev.yml up
#   INFERENCE_BACKEND=vllm docker compose -f docker-compose.dev.yml --profile vllm up
#   MODEL_TIER=lightweight docker compose -f docker-compose.dev.yml up
#
# Access:
#   Streamlit UI:  http://localhost:8501
#   MLflow UI:     http://localhost:5000
# ============================================================

services:

  # --- Ollama (default inference backend) ---
  ollama:
    image: ollama/ollama:latest
    container_name: code-doc-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    # GPU: docker compose -f docker-compose.dev.yml -f docker-compose.gpu.yml up

  # --- Model bootstrap ---
  ollama-bootstrap:
    image: ollama/ollama:latest
    container_name: code-doc-bootstrap
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=ollama:11434
      - MODEL_TIER=${MODEL_TIER:-full}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-embed-text}
    entrypoint: >
      bash -c '
        QUANT="${QUANTISATION:-q4_K_M}"
        case "$${MODEL_TIER}" in
          heavy)       BASE="deepseek-coder-v2:16b-lite-instruct" ;;
          full)        BASE="mistral-nemo:12b-instruct" ;;
          balanced)    BASE="qwen2.5-coder:7b" ; QUANT="" ;;
          lightweight) BASE="phi3.5" ; QUANT="" ;;
          minimal)     BASE="qwen2.5-coder:3b-instruct" ; QUANT="" ;;
          *)           BASE="mistral-nemo:12b-instruct" ;;
        esac
        if [ -n "$${QUANT}" ]; then
          MODEL="$${BASE}-$${QUANT}"
        else
          MODEL="$${BASE}"
        fi
        echo "Pulling LLM: $${MODEL} (tier=$${MODEL_TIER}, quant=$${QUANT:-default})"
        ollama pull $${MODEL}
        echo "Pulling embedding model: $${EMBEDDING_MODEL}"
        ollama pull $${EMBEDDING_MODEL}
        echo "Bootstrap complete."
      '
    restart: "no"

  # --- vLLM (alternative inference backend, GPU required) ---
  # Enable with: INFERENCE_BACKEND=vllm docker compose -f docker-compose.dev.yml --profile vllm up
  vllm:
    image: vllm/vllm-openai:latest
    container_name: code-doc-vllm
    profiles: ["vllm"]
    ports:
      - "8080:8000"
    volumes:
      - vllm_model_cache:/root/.cache/huggingface
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    command:
      - "--model"
      - "${VLLM_MODEL:-mistralai/Mistral-7B-Instruct-v0.3}"
      - "--tensor-parallel-size"
      - "${VLLM_TP:-1}"
      - "--max-model-len"
      - "32768"
      - "--gpu-memory-utilization"
      - "0.90"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # --- llama-server / llama.cpp (CPU-native alternative, lightweight/minimal tiers) ---
  # Enable with: INFERENCE_BACKEND=llamacpp docker compose -f docker-compose_dev.yml --profile llamacpp up
  # Models must be downloaded as GGUF files into ./models/ before starting.
  # Default here targets the `full` tier (mistral-nemo) — verified GGUF, see below.
  # Other tiers: lightweight → phi3.5 Q4, minimal → qwen2.5-coder:3b Q4 (swap the
  # three LLAMACPP_* env vars below to point at a different downloaded GGUF).
  #
  # Download model example (full tier — bartowski's quant, verified real/pullable,
  # NOT guessed: https://huggingface.co/bartowski/Mistral-Nemo-Instruct-2407-GGUF):
  #   mkdir -p models
  #   curl -L -o models/mistral-nemo-instruct-2407-q4_k_m.gguf \
  #     https://huggingface.co/bartowski/Mistral-Nemo-Instruct-2407-GGUF/resolve/main/Mistral-Nemo-Instruct-2407-Q4_K_M.gguf
  #
  # Download model example (heavy tier — bartowski's quant, verified real/pullable:
  # https://huggingface.co/bartowski/DeepSeek-Coder-V2-Lite-Instruct-GGUF):
  #   curl -L -o models/deepseek-coder-v2-lite-instruct-q4_k_m.gguf \
  #     https://huggingface.co/bartowski/DeepSeek-Coder-V2-Lite-Instruct-GGUF/resolve/main/DeepSeek-Coder-V2-Lite-Instruct-Q4_K_M.gguf
  #
  # heavy tier: MODEL_TIER=heavy INFERENCE_BACKEND=llamacpp docker compose ... up
  llamacpp:
    # ggerganov/llama.cpp was renamed to ggml-org/llama.cpp on GHCR — the old
    # path 404s. Verified against the project's own current docs, not guessed.
    # server-cuda (not plain server, which is CPU-only) is required for
    # --n-gpu-layers to actually do anything — plain :server has no CUDA support
    # compiled in.
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: code-doc-llamacpp
    profiles: ["llamacpp"]
    ports:
      - "8081:8080"
    volumes:
      - ./models:/models:ro
    environment:
      - MODEL_TIER=${MODEL_TIER:-full}
      # Pass-through so host-side overrides actually reach the container. Empty
      # means "use the tier default" because the script uses the :- form.
      - LLAMACPP_GPU_LAYERS=${LLAMACPP_GPU_LAYERS:-}
      - LLAMACPP_CTX_SIZE=${LLAMACPP_CTX_SIZE:-}
      - LLAMACPP_THREADS=${LLAMACPP_THREADS:-}
      - LLAMACPP_MODEL_PATH=${LLAMACPP_MODEL_PATH:-}
    # GPU device reservation was missing entirely — without this, the container
    # has no GPU access regardless of image or --n-gpu-layers, matching the
    # same block vllm already has below.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Tier-driven, mirroring ollama-bootstrap's case-statement pattern below,
    # rather than requiring 4 manual LLAMACPP_* overrides every time you want
    # to switch which GGUF this serves. Explicit LLAMACPP_* env vars still
    # override the tier default if set (e.g. to point at a different quant).
    entrypoint: >
      bash -c '
        case "$${MODEL_TIER}" in
          heavy)
            # DeepSeek-Coder-V2-Lite-Instruct: 27 transformer layers (verified
            # against deepseek-ai'"'"'s own model card), 10.4GB at Q4_K_M
            # (verified against two independent GGUF quant listings). On a
            # 12GB card that leaves ~1.6GB for KV cache -- full offload at a
            # large context does not reliably fit (this matches the ~13GB
            # total the same model needed via Ollama earlier in this project).
            # Defaults below are DELIBERATELY conservative -- not all 28
            # (27+1) layers on GPU, smaller context than full tier -- leaving
            # real headroom rather than guessing at the exact limit. This
            # explicit, tunable split is the actual advantage llama.cpp has
            # over Ollama here: Ollama silently auto-decided a 20/80 CPU/GPU
            # split with no visibility; this one is a deliberate, adjustable
            # starting point. Tune from here: watch this container'"'"'s logs
            # for the layer-offload line and `nvidia-smi` VRAM usage; raise
            # LLAMACPP_GPU_LAYERS toward 28 if you have headroom, lower it or
            # shrink LLAMACPP_CTX_SIZE further if you see OOM or slowdown.
            MODEL_PATH="$${LLAMACPP_MODEL_PATH:-/models/deepseek-coder-v2-lite-instruct-q4_k_m.gguf}"
            MODEL_NAME="$${LLAMACPP_MODEL:-deepseek-coder-v2-lite-instruct-q4_k_m}"
            CTX="$${LLAMACPP_CTX_SIZE:-4096}"
            NGL="$${LLAMACPP_GPU_LAYERS:-24}"
            ;;
          full|*)
            MODEL_PATH="$${LLAMACPP_MODEL_PATH:-/models/mistral-nemo-instruct-2407-q4_k_m.gguf}"
            MODEL_NAME="$${LLAMACPP_MODEL:-mistral-nemo-instruct-2407-q4_k_m}"
            CTX="$${LLAMACPP_CTX_SIZE:-8192}"
            # 999 = offload every layer llama.cpp can (standard shorthand for
            # "as many as the model has"). 7.48GB Q4_K_M comfortably fits a
            # 12GB card alongside an 8192 context, unlike heavy above.
            NGL="$${LLAMACPP_GPU_LAYERS:-999}"
            ;;
        esac
        echo "llama-server: tier=$${MODEL_TIER:-full} model=$${MODEL_NAME} ctx=$${CTX} ngl=$${NGL}"
        # Binary lives at /app/llama-server in the ggml-org server images (taken
        # from the upstream Dockerfile ENTRYPOINT). Fall back to PATH or the root.
        BIN=/app/llama-server
        [ -x "$${BIN}" ] || BIN="$$(command -v llama-server || echo /llama-server)"
        exec "$${BIN}" \
          --model "$${MODEL_PATH}" \
          -a "$${MODEL_NAME}" \
          --ctx-size "$${CTX}" \
          --threads "$${LLAMACPP_THREADS:-4}" \
          --n-gpu-layers "$${NGL}" \
          --host 0.0.0.0 \
          --port 8080
      '
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --- ChromaDB ---
  chromadb:
    image: chromadb/chroma:0.6.3
    container_name: code-doc-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=false
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- MLflow tracking server (always-on in dev) ---
  # profiles: ["default", ...] is required here, not optional — master's
  # docker-compose.yml tags its own mlflow service with profiles:["observability"],
  # and Compose merges profiles per service name ADDITIVELY across -f files
  # (union, not replace) rather than letting this file's absence of the key
  # clear what master set. Without "default" explicitly listed, the merged
  # mlflow service silently inherits master's "observability" gate and gets
  # excluded from every dev invocation that doesn't pass --profile observability
  # -- which was every single one, causing "depends on undefined service
  # mlflow" regardless of which other profile/script/file combination was used.
  mlflow:
    profiles: ["default"]
    image: ghcr.io/mlflow/mlflow:latest
    container_name: code-doc-mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --default-artifact-root=/mlflow/artifacts
      # Recent MLflow servers answer "403 Invalid Host header" to any Host not on this list. The app
      # reaches the server as mlflow:5000 (docker service name), which is NOT on the default list, so
      # every tracking call from the app was refused -- and the old code swallowed the error silently.
      - --allowed-hosts=${MLFLOW_ALLOWED_HOSTS:-mlflow:5000,localhost:5000,127.0.0.1:5000,host.docker.internal:5000}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- Application (dev branch — LangGraph agent + Streamlit) ---
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: code-doc-app
    ports:
      - "8501:8501"
    depends_on:
      chromadb:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment:
      # Inference backend
      # "auto": the app follows what the stack is actually running (a reachable llama-server => llama.cpp
      # + the tier of the model it serves; see src/deployment.py). Nothing to set by hand. Name a backend
      # here (ollama | vllm | llamacpp) only to PIN it.
      - INFERENCE_BACKEND=${INFERENCE_BACKEND:-auto}
      - OLLAMA_HOST=http://ollama:11434
      - VLLM_HOST=http://vllm:8000
      - LLAMACPP_HOST=http://llamacpp:8080
      - OLLAMA_MODEL=${OLLAMA_MODEL:-mistral-nemo:12b-instruct-q4_K_M}
      # Fallback label only: the app reads the real served model from llama-server (/v1/models).
      - LLAMACPP_MODEL=${LLAMACPP_MODEL:-mistral-nemo-instruct-2407-q4_k_m}

      # Vector DB
      - CHROMA_HOST=http://chromadb:8000

      # MLflow
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      # Browser-reachable MLflow address, used only for the "Last MLflow run" link in the UI
      # (MLFLOW_TRACKING_URI above is the container-internal hostname).
      - MLFLOW_UI_URL=${MLFLOW_UI_URL:-http://localhost:5000}
      - MLFLOW_EXPERIMENT=${MLFLOW_EXPERIMENT:-code-doc-assistant-dev}
      - EVAL_GROUP=${EVAL_GROUP:-}
      - MAX_REPLANS=${MAX_REPLANS:-3}

      # Model / embedding / quantisation
      - MODEL_TIER=${MODEL_TIER:-full}
      - QUANTISATION=${QUANTISATION:-q4_K_M}
      - DEPLOYMENT_TARGET=${DEPLOYMENT_TARGET:-local}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-embed-text}
      # Where the embedding model runs: 0 = CPU (default; keeps the GPU for the answering LLM),
      # -1 = let Ollama decide. See src/embedding.py.
      - EMBED_NUM_GPU=${EMBED_NUM_GPU:-0}

      # Agent behaviour
      - HITL_ENABLED=${HITL_ENABLED:-true}
      - OUTPUT_REVIEW_MODE=${OUTPUT_REVIEW_MODE:-human}
      - QUALITY_GATE_THRESHOLD=${QUALITY_GATE_THRESHOLD:-6.0}
      - CONFIDENCE_THRESHOLD=${CONFIDENCE_THRESHOLD:-0.45}
      - MAX_RETRIEVAL_ATTEMPTS=${MAX_RETRIEVAL_ATTEMPTS:-3}
      - MAX_GENERATION_ATTEMPTS=${MAX_GENERATION_ATTEMPTS:-3}
      - MAX_CONTEXT_TOKENS=${MAX_CONTEXT_TOKENS:-8000}

      # Graph DB (Kuzu)
      - GRAPH_ENABLED=${GRAPH_ENABLED:-true}
      - GRAPH_PATH=/data/graph
      - GRAPH_CO_CHANGE_COMMITS=${GRAPH_CO_CHANGE_COMMITS:-100}

      # MCP servers (all opt-in, disabled by default)
      - MCP_FILESYSTEM_ENABLED=${MCP_FILESYSTEM_ENABLED:-false}
      - MCP_FILESYSTEM_URL=${MCP_FILESYSTEM_URL:-http://localhost:3000}
      - MCP_GITHUB_ENABLED=${MCP_GITHUB_ENABLED:-false}
      - MCP_GITHUB_URL=${MCP_GITHUB_URL:-http://localhost:3001}
      - MCP_SLACK_ENABLED=${MCP_SLACK_ENABLED:-false}
      - MCP_SLACK_URL=${MCP_SLACK_URL:-http://localhost:3002}

      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ${REPO_PATH:-./repos}:/data/repos:ro
      - graph_data:/data/graph
      - ./src:/app/src   # live-reload during development

volumes:
  ollama_data:
    driver: local
  vllm_model_cache:
    driver: local
  chroma_data:
    driver: local
  mlflow_data:
    driver: local
  graph_data:
    driver: local
